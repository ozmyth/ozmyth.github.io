<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ozmyth</title>
<meta name="description" content="ozmyth — systems, interfaces, unfinished ideas." />

<style>
  :root{
    --bg:#050507;
    --surface:#0d0d12;
    --fg:#d4d4dc;
    --dim:#5b5b6e;
    --accent:#8b9dff;
    --accent2:#5be9c9;
    --accent3:#ff7eb6;
    --line:rgba(255,255,255,.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{background:var(--bg)}
  body{
    min-height:100vh;
    font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,monospace;
    color:var(--fg);
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }

  #particles{position:fixed;inset:0;z-index:0;pointer-events:none}
  body::after{
    content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.008) 2px,rgba(255,255,255,.008) 4px);
  }

  #glow{
    position:fixed;width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle, rgba(139,157,255,.08), transparent 70%);
    pointer-events:none;z-index:0;transform:translate(-50%,-50%);
  }

  /* ===== shell 拉宽，容纳项目区 ===== */
  .shell{
    width:min(860px,100%);
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.008));
    border-radius:14px;
    padding:56px 52px 44px;
    position:relative;
    z-index:2;
    backdrop-filter:blur(12px);
    box-shadow:0 0 60px rgba(139,157,255,.08),0 0 120px rgba(91,233,201,.04),inset 0 1px 0 rgba(255,255,255,.05);
    animation:shellIn .8s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes shellIn{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}

  .shell::before{
    content:"";position:absolute;top:18px;left:20px;
    width:7px;height:7px;border-radius:50%;background:var(--dim);
    box-shadow:14px 0 0 var(--dim), 28px 0 0 var(--dim);opacity:.55;
  }
  .shell::after{
    content:"";position:absolute;top:20px;right:22px;
    width:6px;height:6px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 8px var(--accent2),0 0 20px var(--accent2);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

  .prompt{color:var(--dim);font-size:12.5px;letter-spacing:.06em;margin-bottom:28px;padding-top:14px}
  .prompt span{color:var(--accent)}

  .name{
    font-size:clamp(46px,8.5vw,78px);font-weight:600;letter-spacing:-0.035em;line-height:.92;
    background:linear-gradient(135deg,#e8e8f0 0%,#8b9dff 55%,#5be9c9 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(139,157,255,.15));
  }
  .caret{
    display:inline-block;width:11px;height:.82em;background:var(--accent);
    margin-left:8px;vertical-align:-2px;border-radius:1px;
    animation:caret 1.15s steps(2) infinite;
    box-shadow:0 0 8px var(--accent),0 0 20px rgba(139,157,255,.4);
  }
  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}

  .bio{margin-top:32px;color:#9a9aad;font-size:14.5px;max-width:50ch}
  .bio em{color:var(--fg);font-style:normal;position:relative}
  .bio em::after{
    content:"";position:absolute;bottom:-2px;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5;
  }

  .type-line{overflow:hidden;white-space:nowrap;border-right:2px solid var(--accent);width:0;
    animation:typing 2.4s steps(38,end) .6s forwards,blink-caret .7s step-end infinite;}
  @keyframes typing{from{width:0}to{width:100%}}
  @keyframes blink-caret{0%,100%{border-color:var(--accent)}50%{border-color:transparent}}

  .divider{margin:36px 0 28px;height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);position:relative;overflow:hidden}
  .divider::after{
    content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(139,157,255,.4),transparent);
    animation:dividerSweep 3s ease-in-out infinite;
  }
  @keyframes dividerSweep{0%{left:-100%}100%{left:100%}}

  /* ===== 区块标题 ===== */
  .section-title{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);margin-bottom:18px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title::before{
    content:"";width:24px;height:2px;background:var(--accent);border-radius:1px;
    box-shadow:0 0 6px var(--accent);
  }

  /* ===== 项目卡片 ===== */
  .projects{display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
  .project-card{
    position:relative;
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 24px;
    background:linear-gradient(135deg, rgba(139,157,255,.04), rgba(91,233,201,.02));
    transition:all .3s cubic-bezier(.16,1,.3,1);
    overflow:hidden;
    opacity:0;
    animation:cardIn .5s ease-out forwards;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}

  .project-card:nth-child(1){animation-delay:.3s}
  .project-card:nth-child(2){animation-delay:.45s}
  .project-card:nth-child(3){animation-delay:.6s}

  .project-card::before{
    content:"";position:absolute;top:0;left:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--accent),var(--accent2));
    border-radius:3px 0 0 3px;
  }
  .project-card::after{
    content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;
    background:radial-gradient(circle,rgba(139,157,255,.06),transparent 70%);
    pointer-events:none;
  }
  .project-card:hover{
    border-color:rgba(139,157,255,.25);
    transform:translateY(-2px);
    box-shadow:0 8px 30px rgba(139,157,255,.08),0 0 60px rgba(91,233,201,.04);
    background:linear-gradient(135deg, rgba(139,157,255,.07), rgba(91,233,201,.03));
  }

  .pc-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .pc-num{
    font-size:10px;letter-spacing:.15em;color:var(--accent);
    border:1px solid rgba(139,157,255,.3);border-radius:4px;padding:2px 7px;
    font-weight:700;
  }
  .pc-name{
    font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--fg);
    background:linear-gradient(90deg,#e8e8f0,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .pc-badge{
    font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent2);border:1px solid rgba(91,233,201,.3);
    border-radius:20px;padding:2px 9px;font-weight:700;
  }

  .pc-desc{font-size:13.5px;color:#9a9aad;line-height:1.7;margin-bottom:12px;max-width:58ch}

  .pc-tech{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .pc-tech span{
    font-size:10.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:4px;padding:2px 8px;
    background:rgba(255,255,255,.02);
    transition:all .2s;
  }
  .pc-tech span:hover{color:var(--accent);border-color:rgba(139,157,255,.3)}

  .pc-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .pc-install{
    font-size:11.5px;color:var(--accent2);
    background:rgba(91,233,201,.06);
    border:1px solid rgba(91,233,201,.2);
    border-radius:5px;padding:5px 11px;
    font-family:inherit;
    display:inline-flex;align-items:center;gap:8px;
  }
  .pc-install .prompt-sym{color:var(--dim)}
  .pc-install .copy-btn{
    color:var(--accent);cursor:pointer;font-family:inherit;font-size:10px;
    border:1px solid rgba(139,157,255,.3);border-radius:3px;padding:1px 6px;
    background:rgba(139,157,255,.06);transition:all .2s;
  }
  .pc-install .copy-btn:hover{background:rgba(139,157,255,.15);color:#fff}

  .pc-links{display:flex;gap:8px}
  .pc-links a{
    font-size:11px;color:var(--fg);text-decoration:none;
    border:1px solid var(--line);border-radius:5px;padding:5px 12px;
    transition:all .2s;display:inline-flex;align-items:center;gap:5px;
  }
  .pc-links a:hover{
    border-color:var(--accent);color:#fff;
    background:rgba(139,157,255,.1);
    box-shadow:0 0 12px rgba(139,157,255,.15);
  }

  /* "更多项目" 占位卡 */
  .pc-placeholder{
    border:1px dashed rgba(255,255,255,.08);
    border-radius:10px;
    padding:18px 24px;
    text-align:center;
    color:var(--dim);
    font-size:12px;
    letter-spacing:.08em;
    transition:all .3s;
  }
  .pc-placeholder:hover{
    border-color:rgba(139,157,255,.2);
    color:var(--accent);
    background:rgba(139,157,255,.03);
  }
  .pc-placeholder .arrow{display:inline-block;margin-left:6px;transition:transform .3s}
  .pc-placeholder:hover .arrow{transform:translateX(4px)}

  /* ===== 链接区（保留，但降级） ===== */
  .meta{list-style:none;font-size:13px;color:var(--dim)}
  .meta li{padding:5px 0;display:flex;gap:14px;opacity:0;animation:liIn .4s ease-out forwards}
  .meta li:nth-child(1){animation-delay:.9s}
  .meta li:nth-child(2){animation-delay:1.05s}
  @keyframes liIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  .meta li::before{content:"→";color:var(--accent);opacity:.7;flex-shrink:0;transition:transform .2s}
  .meta li:hover::before{transform:translateX(4px)}
  .meta a{color:#b8b8c8;text-decoration:none;border-bottom:1px solid transparent;transition:.2s;position:relative}
  .meta a:hover{border-bottom-color:var(--accent);color:#fff}

  .sig{margin-top:40px;font-size:11.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;text-align:center;position:relative}
  .sig::before{
    content:"";position:absolute;top:-20px;left:50%;transform:translateX(-50%);
    width:30px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);
  }

  @media(max-width:560px){
    .shell{padding:44px 26px 36px}
    .type-line{white-space:normal;border-right:none;width:auto;animation:none}
    .pc-bottom{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div id="glow"></div>

  <div class="shell">
    <div class="prompt"><span>~/ozmyth</span> · whoami</div>

    <div class="name">ozmyth<span class="caret"></span></div>

    <p class="bio">
      <em>QA engineer</em>, writing small systems at the seam of logic and ambiguity.<br/>
      <span class="type-line">quiet tools, slow interfaces, unfinished ideas worth keeping.</span>
    </p>

    <div class="divider"></div>

    <!-- ===== 项目区（醒目、独立） ===== -->
    <div class="section-title">open source</div>
    <div class="projects" id="projects"></div>

    <div class="divider"></div>

    <!-- ===== 链接区（降级保留） ===== -->
    <div class="section-title">links</div>
    <ul class="meta">
      <li><a href="https://github.com/ozmyth">github.com/ozmyth</a></li>
      <li><a href="https://ozmyth.github.io">ozmyth.github.io</a></li>
    </ul>

    <div class="sig">© <span id="yr"></span> ozmyth · rendered on github pages</div>
  </div>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  // ===== 项目数据 —— 以后加项目只改这里 =====
  const projects = [
    {
    name: "diffray",
    desc: "Path-level JSON / YAML diff engine.\nNot a line diff — it parses first, normalizes noise, then compares by field path.\nSplits real changes from equivalent-but-restyled values, and tags every field with a severity.",
    tech: ["Go", "package", "JSON", "YAML", "Structural Diff", "Severity"],
    install: "docker pull ozmyth/diffray:latest",
    links: [
      { label: "code",   href: "https://github.com/ozmyth/diffray" },
      { label: "document", href: "https://ozmyth.github.io/diffray-landing.html" },
    ]
  },
    // 以后加项目，复制上面这个对象，改内容即可 ↓
    // {
    //   name: "project-two",
    //   desc: "...",
    //   tech: ["Rust", "WASM"],
    //   install: "cargo install project-two",
    //   links: [{ label: "code", href: "..." }]
    // },
  ];

  const container = document.getElementById('projects');

  projects.forEach((p, i) => {
    const num = String(i + 1).padStart(2, '0');
    const techHTML = p.tech.map(t => `<span>${t}</span>`).join('');
    const linksHTML = p.links.map(l =>
      `<a href="${l.href}" target="_blank" rel="noopener">${l.label} ↗</a>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <div class="pc-top">
        <span class="pc-num">#${num}</span>
        <span class="pc-name">${p.name}</span>
        <span class="pc-badge">public</span>
      </div>
      <div class="pc-desc">${p.desc.replace(/\n/g, '<br/>')}</div>
      <div class="pc-tech">${techHTML}</div>
      <div class="pc-bottom">
        <div class="pc-install">
          <span class="prompt-sym">$</span>${p.install}
          <span class="copy-btn" data-cmd="${p.install}">copy</span>
        </div>
        <div class="pc-links">${linksHTML}</div>
      </div>
    `;
    container.appendChild(card);
  });

  // 追加 "更多项目" 占位卡
  const placeholder = document.createElement('div');
  placeholder.className = 'pc-placeholder';
  placeholder.innerHTML = `more projects coming soon<span class="arrow">→</span>`;
  placeholder.style.animation = `cardIn .5s ease-out ${0.6 + projects.length * 0.15}s forwards`;
  placeholder.style.opacity = '0';
  container.appendChild(placeholder);

  // copy 按钮
  container.addEventListener('click', e => {
    const btn = e.target.closest('.copy-btn');
    if (btn) navigator.clipboard?.writeText(btn.dataset.cmd);
  });

  // ===== 粒子系统 =====
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  class Particle {
    constructor(){ this.reset(); }
    reset(){
      this.x = Math.random() * W; this.y = Math.random() * H;
      this.r = Math.random() * 1.5 + .3;
      this.dx = (Math.random() - .5) * .3; this.dy = (Math.random() - .5) * .3;
      this.opacity = Math.random() * .5 + .1;
      this.color = Math.random() > .6 ? '#8b9dff' : Math.random() > .5 ? '#5be9c9' : '#ff7eb6';
    }
    update(){ this.x += this.dx; this.y += this.dy; if(this.x<0||this.x>W||this.y<0||this.y>H) this.reset(); }
    draw(){
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fillStyle = this.color; ctx.globalAlpha = this.opacity; ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  for(let i=0;i<80;i++) particles.push(new Particle());
  function animate(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{p.update();p.draw();});
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<120){
          ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=particles[i].color;ctx.globalAlpha=(.15*(1-dist/120));ctx.lineWidth=.5;ctx.stroke();ctx.globalAlpha=1;
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();

  // 鼠标光晕
  const glow = document.getElementById('glow');
  document.addEventListener('mousemove', e => { glow.style.left = e.clientX+'px'; glow.style.top = e.clientY+'px'; });
</script>
</body>
</html>
