<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ozmyth</title>
<meta name="description" content="ozmyth — building quiet tools, writing code at the edge." />

<style>
  :root{
    --bg:#0a0a0f;
    --bg-soft:#101018;
    --fg:#d7d7e0;
    --muted:#8a8aa0;
    --accent:#7c8cff;
    --accent-2:#5be9c9;
    --border:rgba(255,255,255,.08);
  }

  *{box-sizing:border-box}

  html,body{height:100%}
  body{
    margin:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(124,140,255,.18), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(91,233,201,.12), transparent 55%),
      var(--bg);
    color:var(--fg);
    display:flex;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:32px;
  }

  .card{
    width:min(760px,100%);
    border:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
    backdrop-filter:blur(8px);
    border-radius:18px;
    padding:42px 38px;
    box-shadow:0 30px 120px rgba(0,0,0,.45);
  }

  .eyebrow{
    color:var(--muted);
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:12px;
    margin:0 0 18px;
  }

  h1{
    font-size:clamp(40px,9vw,84px);
    line-height:.95;
    margin:0;
    font-weight:700;
    letter-spacing:-.02em;
  }

  h1 .glow{
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .cursor{
    display:inline-block;
    width:14px;
    height:1.1em;
    transform:translateY(2px);
    background:var(--accent);
    margin-left:6px;
    animation:blink 1.1s steps(1) infinite;
    border-radius:2px;
  }
  @keyframes blink{50%{opacity:0}}

  p.tag{
    color:var(--muted);
    font-size:16px;
    margin:22px 0 30px;
    max-width:52ch;
    line-height:1.7;
  }

  .links{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
  }

  a.link{
    text-decoration:none;
    color:var(--fg);
    border:1px solid var(--border);
    padding:11px 16px;
    border-radius:999px;
    font-size:14px;
    transition:.18s ease;
    background:rgba(255,255,255,.02);
  }
  a.link:hover{
    border-color:var(--accent);
    color:#fff;
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(124,140,255,.25);
  }

  .foot{
    margin-top:34px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.04em;
  }

  @media (max-width:520px){
    .card{padding:30px 22px}
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">developer · builder · myth-maker</p>

    <h1>
      ozmyth<span class="cursor"></span>
    </h1>

    <p class="tag">
      building quiet tools.<br/>
      writing code at the edge of systems, interfaces and ideas.
    </p>

    <div class="links">
      <a class="link" href="https://github.com/ozmyth">github ↗</a>
      <a class="link" href="https://www.npmjs.com/~ozmyth">npm ↗</a>
      <a class="link" href="mailto:ozmyth@users.noreply.github.com">email ↗</a>
    </div>

    <div class="foot">
      © <span id="year"></span> ozmyth — deployed on GitHub Pages
    </div>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
