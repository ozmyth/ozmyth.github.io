<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ozmyth</title>
<meta name="description" content="ozmyth — systems, interfaces, unfinished ideas." />

<style>
  :root{
    --bg:#050507;
    --surface:#0d0d12;
    --fg:#d4d4dc;
    --dim:#5b5b6e;
    --accent:#8b9dff;
    --line:rgba(255,255,255,.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{background:var(--bg)}
  body{
    min-height:100vh;
    font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,monospace;
    color:var(--fg);
    background:
      radial-gradient(1200px 700px at 88% -8%, rgba(139,157,255,.10), transparent 65%),
      radial-gradient(900px 600px at -12% 104%, rgba(91,233,201,.06), transparent 60%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }

  .shell{
    width:min(680px,100%);
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.008));
    border-radius:14px;
    padding:56px 52px 44px;
    position:relative;
  }

  /* 左上角小点 */
  .shell::before{
    content:"";
    position:absolute;
    top:18px;left:20px;
    width:7px;height:7px;border-radius:50%;
    background:var(--dim);
    box-shadow:14px 0 0 var(--dim), 28px 0 0 var(--dim);
    opacity:.55;
  }

  .prompt{
    color:var(--dim);
    font-size:12.5px;
    letter-spacing:.06em;
    margin-bottom:28px;
    padding-top:14px;
  }
  .prompt span{color:var(--accent)}

  .name{
    font-size:clamp(46px,8.5vw,78px);
    font-weight:600;
    letter-spacing:-0.035em;
    line-height:.92;
    background:linear-gradient(135deg,#e8e8f0 0%,#8b9dff 55%,#5be9c9 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  .caret{
    display:inline-block;
    width:11px;height:.82em;
    background:var(--accent);
    margin-left:8px;vertical-align:-2px;
    border-radius:1px;
    animation:caret 1.15s steps(2) infinite;
  }
  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}

  .bio{
    margin-top:32px;
    color:#9a9aad;
    font-size:14.5px;
    max-width:50ch;
  }
  .bio em{color:var(--fg);font-style:normal}

  .divider{
    margin:36px 0 28px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);
  }

  .meta{
    list-style:none;
    font-size:13px;
    color:var(--dim);
  }
  .meta li{
    padding:5px 0;
    display:flex;gap:14px;
  }
  .meta li::before{
    content:"→";color:var(--accent);opacity:.7;flex-shrink:0;
  }
  .meta a{
    color:#b8b8c8;text-decoration:none;
    border-bottom:1px solid transparent;
    transition:.2s;
  }
  .meta a:hover{border-bottom-color:var(--accent);color:#fff}

  .sig{
    margin-top:40px;
    font-size:11.5px;
    color:var(--dim);
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  @media(max-width:560px){
    .shell{padding:44px 26px 36px}
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="prompt"><span>~/ozmyth</span> · whoami</div>

    <div class="name">ozmyth<span class="caret"></span></div>

    <p class="bio">
      <em>QA engineer</em>, writing small systems at the seam of logic and ambiguity.<br/>
      quiet tools, slow interfaces, unfinished ideas worth keeping.
    </p>

    <div class="divider"></div>

    <ul class="meta">
      <li><a href="https://github.com/ozmyth">github.com/ozmyth</a></li>
      <li><a href="https://ozmyth.github.io">ozmyth.github.io</a></li>
      <li><a href="https://ozmyth.github.io/diffray-landing.html">diffray — field-aware JSON diff engine</a></li>
    </ul>

    <div class="sig">© <span id="yr"></span> ozmyth · rendered on github pages</div>
  </div>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
